<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HelixAmc Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:        #0F1117;
  --surface:   #181B24;
  --surface2:  #1E2230;
  --border:    #2A2E3E;
  --border2:   #333849;
  --text:      #E8EAF0;
  --text-sub:  #7A8099;
  --text-mute: #464D66;
  --accent:    #4F8EF7;
  --accent-dim:#1A2D54;
  --green:     #34C759;
  --green-dim: #0D2E1A;
  --red:       #FF453A;
  --red-dim:   #2E0E0C;
  --meta:   #1877F2;
  --google: #EA4335;
  --daangn: #FF6F0F;
  --naver:  #03C75A;
  --kakao:  #FAE100;
  --sidebar-w: 220px;
  --sidebar-collapsed: 0px;
  --radius: 12px;
  --font-mono: 'DM Mono', monospace;
}

html { font-size: 14px; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── APP LAYOUT ── */
.app { display: flex; min-height: 100vh; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  z-index: 40;
  transition: width 0.25s cubic-bezier(0.4,0,0.2,1);
  overflow: hidden;
}
.sidebar.collapsed { width: 52px; }

.sidebar-header {
  height: 60px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
  gap: 10px;
  flex-shrink: 0;
}
.sidebar-logo {
  display: flex; align-items: center; gap: 10px;
  overflow: hidden; white-space: nowrap;
  flex: 1;
}
.logo-dot { width:8px; height:8px; border-radius:50%; background: var(--accent); flex-shrink:0; }
.logo-text {
  font-size: 14px; font-weight: 700; letter-spacing: -0.5px;
  color: var(--text);
  opacity: 1; transition: opacity 0.2s;
}
.sidebar.collapsed .logo-text { opacity: 0; }

.sidebar-toggle {
  width: 26px; height: 26px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text-sub);
  cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }

.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; overflow-x: hidden; }
.sidebar-nav::-webkit-scrollbar { width: 3px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── NAV SECTION ── */
.nav-section { margin-bottom: 4px; }

.nav-section-header {
  display: flex; align-items: center;
  padding: 8px 14px;
  cursor: pointer;
  border-radius: 0;
  gap: 10px;
  user-select: none;
  transition: background 0.15s;
  white-space: nowrap;
  position: relative;
}
.nav-section-header:hover { background: rgba(255,255,255,0.04); }

.nav-section-icon {
  width: 24px; height: 24px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  background: var(--surface2);
}

.nav-section-label {
  font-size: 12px; font-weight: 600;
  color: var(--text-sub);
  letter-spacing: 0.3px;
  flex: 1;
  opacity: 1; transition: opacity 0.2s;
}
.sidebar.collapsed .nav-section-label { opacity: 0; }

.nav-section-arrow {
  font-size: 10px; color: var(--text-mute);
  transition: transform 0.2s, opacity 0.2s;
  opacity: 1;
}
.sidebar.collapsed .nav-section-arrow { opacity: 0; }
.nav-section.open .nav-section-arrow { transform: rotate(90deg); }

/* ── NAV ITEMS ── */
.nav-items {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.25s cubic-bezier(0.4,0,0.2,1);
}
.nav-section.open .nav-items { max-height: 400px; }
.sidebar.collapsed .nav-items { max-height: 0 !important; }

.nav-item {
  display: flex; align-items: center;
  padding: 7px 14px 7px 48px;
  cursor: pointer;
  gap: 8px;
  border-radius: 0;
  white-space: nowrap;
  transition: background 0.12s;
  font-size: 13px;
  color: var(--text-sub);
  border-left: 2px solid transparent;
}
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.nav-item.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: var(--accent-dim);
  font-weight: 600;
}

.nav-item-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Collapsed tooltip */
.sidebar.collapsed .nav-section-header { padding: 8px 14px; justify-content: center; }
.sidebar.collapsed .nav-item { display: none; }

/* ── MAIN AREA ── */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  transition: margin-left 0.25s cubic-bezier(0.4,0,0.2,1);
}
.main.collapsed { margin-left: 52px; }

/* ── TOPBAR ── */
.topbar {
  position: sticky; top:0; z-index:30;
  background: rgba(15,17,23,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
}

.topbar-left {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-sub);
  overflow: hidden;
}
.topbar-breadcrumb {
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.breadcrumb-sep { color: var(--text-mute); }
.breadcrumb-cur { color: var(--text); font-weight: 600; }

.month-nav { display: flex; align-items: center; gap: 4px; }
.month-btn {
  width:32px; height:32px; border-radius:8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-sub);
  cursor: pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition: all 0.15s ease;
}
.month-btn:hover { border-color: var(--accent); color: var(--accent); }

.month-label {
  font-family: var(--font-mono);
  font-size:14px; font-weight:500;
  color: var(--text);
  min-width: 100px; text-align:center;
  padding: 6px 12px;
  border-radius:8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  transition: all 0.15s ease;
}
.month-label:hover { border-color: var(--accent); color: var(--accent); }

/* ── MONTH PICKER ── */
.picker-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
}
.picker-overlay.open { display: block; }
.picker {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.4);
  width: 260px; z-index: 101;
  animation: slideUp 0.2s ease;
}
.picker-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.picker-year {
  font-family: var(--font-mono);
  font-size: 15px; font-weight: 600; color: var(--text);
}
.picker-year-btn {
  width: 28px; height: 28px; border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--surface2); color: var(--text-sub);
  cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s ease;
}
.picker-year-btn:hover { border-color: var(--accent); color: var(--accent); }
.picker-months {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
}
.picker-month-btn {
  padding: 8px 4px;
  border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--text-sub);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; font-weight: 500;
  cursor: pointer; text-align: center;
  transition: all 0.15s ease;
}
.picker-month-btn:hover { background: var(--surface2); color: var(--text); }
.picker-month-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.picker-month-btn.future { opacity: 0.3; pointer-events: none; }

/* ── LOCK BTN ── */
.lock-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 14px; border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--text-sub);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
}
.lock-btn:hover { border-color: var(--accent); color: var(--accent); }
.lock-btn.unlocked { border-color: var(--green); color: var(--green); background: var(--green-dim); }
.lock-btn .lock-icon { font-size: 13px; }

/* ── CONTENT ── */
.content { flex:1; padding: 28px 24px; max-width:1200px; margin:0 auto; width:100%; }

/* ── SECTION HEADER ── */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.section-title {
  font-size:16px; font-weight:700; letter-spacing:-0.3px;
  display: flex; align-items: center; gap: 10px;
}
.section-badge {
  font-size:11px; font-weight:500; padding:3px 9px; border-radius:20px;
  background: var(--accent-dim); color: var(--accent);
}

/* ── TABLE ── */
.table-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
thead tr { background: var(--surface2); border-bottom: 1px solid var(--border); }
th {
  padding: 12px 16px;
  font-size:11px; font-weight:600; letter-spacing:0.8px;
  color: var(--text-mute); text-transform: uppercase; text-align: right;
}
th:first-child { text-align: left; }
th.col-date    { width:110px; }
th.col-spend   { width:150px; }
th.col-db      { width:110px; }
th.col-cpa     { width:130px; }
th.col-revenue { width:150px; }
th.col-roas    { width:100px; }
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s ease; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.02); }
td { padding: 0; text-align: right; }
td:first-child { text-align: left; }
.td-date { padding: 10px 16px; font-family: var(--font-mono); font-size:13px; color: var(--text-sub); font-weight:400; }
.td-date .day { font-size:11px; color: var(--text-mute); margin-left:6px; }
.cell-input {
  width:100%; height:42px; background: transparent;
  border: none; outline: none; color: var(--text);
  font-family: var(--font-mono); font-size:13px; font-weight:500;
  text-align: right; padding: 0 16px;
  transition: background 0.15s ease; caret-color: var(--accent);
}
.cell-input::placeholder { color: var(--text-mute); font-weight:400; }
.cell-input:focus { background: rgba(79,142,247,0.06); }
.cell-input:disabled { cursor: default; color: var(--text-sub); opacity: 1; }
.cell-input:disabled::placeholder { color: var(--text-mute); }
td.td-cpa { padding: 0 16px; font-family: var(--font-mono); font-size:13px; font-weight:500; color: var(--text-sub); vertical-align:middle; height:42px; }
td.td-cpa.filled { color: var(--green); }
td.td-roas { padding: 0 16px; font-family: var(--font-mono); font-size:13px; font-weight:500; color: var(--text-sub); vertical-align:middle; height:42px; }
td.td-roas.good { color: var(--accent); }
td.td-roas.bad  { color: var(--red); }
tfoot tr { background: var(--surface2); border-top: 2px solid var(--border2); }
tfoot td { padding: 13px 16px; font-family: var(--font-mono); font-size:13px; font-weight:600; color: var(--text); vertical-align:middle; }
tfoot td:first-child { color: var(--text-sub); font-size:11px; letter-spacing:0.5px; text-transform:uppercase; font-family:'Noto Sans KR',sans-serif; }
tfoot td.total-cpa { color: var(--accent); }

/* ── DASHBOARD ── */
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 14px; margin-bottom: 28px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 20px 18px; }
.kpi-label { font-size:11px; font-weight:600; letter-spacing:0.8px; text-transform:uppercase; color: var(--text-mute); margin-bottom: 10px; }
.kpi-value { font-family: var(--font-mono); font-size:22px; font-weight:500; color: var(--text); letter-spacing:-0.5px; margin-bottom:4px; }
.kpi-sub { font-size:11px; color: var(--text-mute); }
.dash-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow:hidden; }
.dash-table { width:100%; border-collapse:collapse; }
.dash-table thead tr { background: var(--surface2); border-bottom: 1px solid var(--border); }
.dash-table th { padding: 12px 20px; font-size:11px; font-weight:600; letter-spacing:0.8px; color: var(--text-mute); text-transform:uppercase; text-align:right; }
.dash-table th:first-child { text-align:left; }
.dash-table tbody tr { border-bottom:1px solid var(--border); transition: background 0.1s; }
.dash-table tbody tr:last-child { border-bottom:none; }
.dash-table tbody tr:hover { background: rgba(255,255,255,0.02); }
.dash-table td { padding:14px 20px; font-family: var(--font-mono); font-size:13px; font-weight:500; text-align:right; color:var(--text); vertical-align:middle; }
.dash-table td:first-child { text-align:left; font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:600; }
.dash-table tfoot tr { background:var(--surface2); border-top:2px solid var(--border2); }
.dash-table tfoot td { color:var(--accent); }
.dash-table tfoot td:first-child { color:var(--text-sub); font-size:11px; letter-spacing:0.5px; text-transform:uppercase; font-family:'Noto Sans KR',sans-serif; font-weight:500; }
.media-badge { display:inline-flex; align-items:center; gap:7px; padding:3px 10px 3px 6px; border-radius:20px; font-size:12px; font-weight:600; }

/* ── CHART ── */
.chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 24px 16px; margin-bottom: 20px; }
.chart-title { font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-mute); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.chart-title-left { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.chart-toggle { display: flex; gap: 3px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
.chart-toggle-btn { padding: 4px 12px; border-radius: 6px; border: none; font-family: 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; background: transparent; color: var(--text-mute); }
.chart-toggle-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
.chart-legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-sub); font-weight: 400; text-transform: none; letter-spacing: 0; }
.legend-bar  { width:12px; height:12px; border-radius:3px; }
.legend-line { width:16px; height:2.5px; border-radius:2px; position:relative; }
.legend-line::after { content:''; position:absolute; width:6px; height:6px; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); background: inherit; }
.chart-canvas-wrap { position:relative; height:220px; }

/* ── MODAL ── */
.modal-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 360px; box-shadow: 0 32px 80px rgba(0,0,0,0.4); animation: slideUp 0.25s ease; }
.modal-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 6px; }
.modal-sub { font-size: 12px; color: var(--text-sub); font-weight: 300; margin-bottom: 24px; }
.modal-input { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 16px; font-family: var(--font-mono); font-size: 20px; font-weight: 500; letter-spacing: 8px; text-align: center; color: var(--text); outline: none; transition: border-color 0.15s ease; margin-bottom: 10px; }
.modal-input:focus { border-color: var(--accent); }
.modal-input.error { border-color: var(--red); animation: shake 0.3s ease; }
.modal-error { font-size: 12px; color: var(--red); min-height: 18px; margin-bottom: 18px; text-align: center; }
.modal-btns { display: flex; gap: 8px; }
.modal-btn { flex:1; padding: 12px; border-radius: 10px; border: none; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
.modal-btn.cancel { background: var(--surface2); color: var(--text-sub); }
.modal-btn.cancel:hover { color: var(--text); }
.modal-btn.confirm { background: var(--accent); color: white; }
.modal-btn.confirm:hover { opacity: 0.88; }

/* ── EMPTY / COMING SOON ── */
.coming-soon {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 360px; gap: 14px;
  color: var(--text-mute); font-size: 13px;
}
.coming-soon-icon { font-size: 40px; opacity: 0.4; }
.coming-soon-title { font-size: 15px; font-weight: 600; color: var(--text-sub); }

/* ── CREATIVE GALLERY ── */
.creative-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
}
.manage-creative-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 18px; border-radius: 10px;
  border: 1px solid var(--accent);
  background: var(--accent-dim); color: var(--accent);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s ease;
}
.manage-creative-btn:hover { background: var(--accent); color: white; }
.creative-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.creative-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease; cursor: pointer;
}
.creative-card:hover { transform: translateY(-4px); box-shadow: 0 12px 36px rgba(0,0,0,0.25); border-color: var(--border2); }
.creative-img-wrap {
  width: 100%; aspect-ratio: 1/1; background: var(--surface2);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.creative-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.creative-img-error { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-mute); font-size: 11px; padding: 16px; text-align: center; }
.creative-info { padding: 12px 14px; }
.creative-campaign { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-mute); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.creative-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.creative-meta { display: flex; align-items: center; justify-content: space-between; }
.creative-date { font-size: 11px; color: var(--text-mute); }
.add-modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 460px; box-shadow: 0 32px 80px rgba(0,0,0,0.4); animation: slideUp 0.25s ease; }
.add-modal-title { font-size: 16px; font-weight: 700; margin-bottom: 24px; }
.form-field { margin-bottom: 16px; }
.form-label { font-size: 11px; font-weight: 600; color: var(--text-mute); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 7px; display: block; }
.form-input { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; outline: none; transition: border-color 0.15s ease; }
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--text-mute); }
.form-hint { font-size: 11px; color: var(--text-mute); margin-top: 5px; }
.manage-modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 400px; box-shadow: 0 32px 80px rgba(0,0,0,0.4); animation: slideUp 0.25s ease; }
.manage-modal-title { font-size: 16px; font-weight: 700; margin-bottom: 24px; text-align: center; }
.manage-options { display: flex; flex-direction: column; gap: 12px; }
.manage-option { padding: 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; transition: all 0.15s ease; text-align: center; }
.manage-option:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
.manage-option-icon { font-size: 20px; margin-bottom: 8px; }
.manage-option-title { font-size: 14px; font-weight: 600; }
.manage-option-desc { font-size: 12px; color: var(--text-mute); margin-top: 4px; }
.select-modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 32px 80px rgba(0,0,0,0.4); animation: slideUp 0.25s ease; }
.select-modal-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
.select-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.select-card { background: var(--surface2); border: 2px solid transparent; border-radius: 12px; padding: 12px; cursor: pointer; transition: all 0.15s ease; position: relative; }
.select-card:hover { border-color: var(--accent); background: var(--accent-dim); }
.select-card.selected { border-color: var(--accent); background: var(--accent-dim); }
.select-card.selected::after { content: '✓'; position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
.select-card-img { width: 100%; aspect-ratio: 1/1; background: var(--surface); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 8px; }
.select-card-img img { width: 100%; height: 100%; object-fit: cover; }
.select-card-title { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.select-card-campaign { font-size: 10px; color: var(--text-mute); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.select-actions { display: flex; gap: 8px; justify-content: center; }
.img-modal-overlay { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
.img-modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
.img-modal-inner { position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.img-modal-inner img { max-width: 90vw; max-height: 80vh; object-fit: contain; border-radius: 12px; }
.img-modal-info { color: white; text-align: center; }
.img-modal-info .title { font-size: 15px; font-weight: 600; }
.img-modal-info .campaign { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
.img-modal-close { position: absolute; top: -40px; right: 0; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.img-modal-close:hover { background: rgba(255,255,255,0.2); }
.creative-empty { grid-column: 1/-1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 12px; color: var(--text-mute); font-size: 13px; }
.creative-empty-icon { font-size: 40px; opacity: 0.3; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius:3px; }

/* ── ANIM ── */
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
@keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ── RESPONSIVE ── */
@media (max-width:768px) {
  :root { --sidebar-w: 52px; }
  .sidebar { width: 52px; }
  .sidebar .logo-text, .sidebar .nav-section-label, .sidebar .nav-section-arrow { opacity: 0; }
  .sidebar .nav-items { max-height: 0 !important; }
  .sidebar .nav-section-header { justify-content: center; padding: 8px 14px; }
  .main { margin-left: 52px; }
  .content { padding: 20px 14px; }
}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-dot"></div>
        <span class="logo-text">마케팅 리포트</span>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>
    </div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <!-- MAIN -->
  <div class="main" id="main">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-breadcrumb" id="breadcrumb"></div>
      </div>
      <div class="month-nav">
        <button class="month-btn" id="prevBtn" onclick="changeMonth(-1)">‹</button>
        <div class="month-label" id="monthLabel" onclick="openPicker()"></div>
        <button class="month-btn" id="nextBtn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="picker-overlay" id="pickerOverlay" onclick="closePicker()"></div>
      <div class="picker" id="picker" style="display:none">
        <div class="picker-header">
          <button class="picker-year-btn" onclick="changePickerYear(-1)">‹</button>
          <div class="picker-year" id="pickerYear"></div>
          <button class="picker-year-btn" onclick="changePickerYear(1)">›</button>
        </div>
        <div class="picker-months" id="pickerMonths"></div>
      </div>
      <button class="lock-btn" id="lockBtn" onclick="onLockBtnClick()">
        <span class="lock-icon">🔒</span>
        <span id="lockBtnText">LOCK</span>
      </button>
    </header>

    <!-- PASSWORD MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="onOverlayClick(event)">
      <div class="modal">
        <div class="modal-title">🔐 편집 잠금 해제</div>
        <div class="modal-sub">데이터를 입력하려면 비밀번호를 입력하세요</div>
        <input class="modal-input" id="pwInput" type="password" maxlength="20" placeholder="••••"
          onkeydown="if(event.key==='Enter') submitPassword()" oninput="clearError()">
        <div class="modal-error" id="pwError"></div>
        <div class="modal-btns">
          <button class="modal-btn cancel" onclick="closeModal()">취소</button>
          <button class="modal-btn confirm" onclick="submitPassword()">확인</button>
        </div>
      </div>
    </div>

    <!-- CONTENT -->
    <main class="content" id="content"></main>

    <!-- IMAGE PREVIEW MODAL -->
    <div class="img-modal-overlay" id="imgModalOverlay" onclick="closeImgModal(event)">
      <div class="img-modal-inner">
        <button class="img-modal-close" onclick="closeImgModal()">✕</button>
        <img id="imgModalSrc" src="" alt="">
        <div class="img-modal-info">
          <div class="title" id="imgModalTitle"></div>
          <div class="campaign" id="imgModalCampaign"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════
   ⚙️  설정
══════════════════════════════════════════════ */
const EDIT_PASSWORD = '9119';
const MIN_YEAR  = 2026;
const MIN_MONTH = 3;

/* ══════════════════════════════════════════════
   메뉴 구조 — 메뉴 추가 시 여기만 수정
══════════════════════════════════════════════ */
const MENU = [
  {
    id: 'adlog',
    label: '광고비 정산',
    icon: '📊',
    items: [
      { id: 'adlog_dashboard', label: '대시보드', dot: null },
      { id: 'adlog_meta',     label: '메타',     dot: '#1877F2' },
      { id: 'adlog_google',   label: '구글',     dot: '#EA4335' },
      { id: 'adlog_daangn',   label: '당근',     dot: '#FF6F0F' },
      { id: 'adlog_naver',    label: '네이버',   dot: '#03C75A' },
      { id: 'adlog_kakao',    label: '카카오',   dot: '#FAE100' },
    ]
  },
  {
    id: 'creative',
    label: '광고 소재 모음',
    icon: '🖼️',
    items: [
      { id: 'creative_meta',   label: '메타',   dot: '#1877F2' },
      { id: 'creative_google', label: '구글',   dot: '#EA4335' },
      { id: 'creative_daangn', label: '당근',   dot: '#FF6F0F' },
      { id: 'creative_naver',  label: '네이버', dot: '#03C75A' },
      { id: 'creative_kakao',  label: '카카오', dot: '#FAE100' },
    ]
  },
];

const MEDIA = [
  { id:'meta',   name:'메타',   color:'#1877F2' },
  { id:'google', name:'구글',   color:'#EA4335' },
  { id:'daangn', name:'당근',   color:'#FF6F0F' },
  { id:'naver',  name:'네이버', color:'#03C75A' },
  { id:'kakao',  name:'카카오', color:'#FAE100' },
];
const DAYS_KO = ['일','월','화','수','목','금','토'];

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
const now = new Date();
let curYear    = now.getFullYear();
let curMonth   = now.getMonth() + 1;
let curPageId  = 'adlog_dashboard';
let isUnlocked = false;
let sidebarCollapsed = false;
let openSections = { adlog: true, creative: false };

/* ══════════════════════════════════════════════
   FIREBASE
══════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyCmJpvfoMvquoBdDJAK4ZJ657C2UOTZ5eU",
  authDomain: "helixamc-pm.firebaseapp.com",
  databaseURL: "https://helixamc-pm-default-rtdb.firebaseio.com",
  projectId: "helixamc-pm",
  storageBucket: "helixamc-pm.firebasestorage.app",
  messagingSenderId: "382526528183",
  appId: "1:382526528183:web:c487b9de1471829afe0b32",
  measurementId: "G-0F55R2PE1Q"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

const dataCache = {};
function cacheKey(year, month, mediaId) { return `${year}_${String(month).padStart(2,'0')}_${mediaId}`; }
function loadData(year, month, mediaId) { return dataCache[cacheKey(year, month, mediaId)] || {}; }
function saveData(year, month, mediaId, data) {
  dataCache[cacheKey(year, month, mediaId)] = data;
  db.ref(`adlog/${year}/${String(month).padStart(2,'00')}/${mediaId}`).set(data).catch(e => console.error(e));
}
async function fetchMonthData(year, month) {
  const snap = await db.ref(`adlog/${year}/${String(month).padStart(2,'0')}`).once('value');
  const val  = snap.val() || {};
  MEDIA.forEach(m => { dataCache[cacheKey(year, month, m.id)] = val[m.id] || {}; });
}
async function fetchAllData() {
  const snap = await db.ref('adlog').once('value');
  const val  = snap.val() || {};
  Object.entries(val).forEach(([year, months]) => {
    Object.entries(months).forEach(([month, medias]) => {
      Object.entries(medias).forEach(([mediaId, data]) => {
        dataCache[cacheKey(Number(year), Number(month), mediaId)] = data || {};
      });
    });
  });
}

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function getDayOfWeek(y, m, d) { return new Date(y, m - 1, d).getDay(); }
function fmtMoney(n) { if (!n && n !== 0) return '-'; return Number(n).toLocaleString('ko-KR'); }
function calcCPA(spend, db) { if (!spend || !db || db === 0) return null; return Math.round(spend / db); }
function calcROAS(revenue, spend) { if (!revenue || !spend || spend === 0) return null; return Math.round((revenue / spend) * 100); }

/* ══════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════ */
function buildSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = MENU.map(section => `
    <div class="nav-section ${openSections[section.id] ? 'open' : ''}" id="section_${section.id}">
      <div class="nav-section-header" onclick="toggleSection('${section.id}')">
        <div class="nav-section-icon">${section.icon}</div>
        <span class="nav-section-label">${section.label}</span>
        <span class="nav-section-arrow">›</span>
      </div>
      <div class="nav-items">
        ${section.items.map(item => `
          <div class="nav-item ${curPageId === item.id ? 'active' : ''}" id="navitem_${item.id}" onclick="navigateTo('${item.id}')">
            ${item.dot
              ? `<span class="nav-item-dot" style="background:${item.dot}"></span>`
              : `<span style="width:6px"></span>`}
            ${item.label}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleSection(sectionId) {
  openSections[sectionId] = !openSections[sectionId];
  const el = document.getElementById(`section_${sectionId}`);
  el.classList.toggle('open', openSections[sectionId]);
}

function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', sidebarCollapsed);
  document.getElementById('main').classList.toggle('collapsed', sidebarCollapsed);
}

function navigateTo(pageId) {
  curPageId = pageId;
  // update active state
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.id === `navitem_${pageId}`);
  });
  updateBreadcrumb();
  render();
}

function updateBreadcrumb() {
  let sectionLabel = '', itemLabel = '';
  for (const section of MENU) {
    const item = section.items.find(i => i.id === curPageId);
    if (item) { sectionLabel = section.label; itemLabel = item.label; break; }
  }
  document.getElementById('breadcrumb').innerHTML = `
    <span>${sectionLabel}</span>
    <span class="breadcrumb-sep">›</span>
    <span class="breadcrumb-cur">${itemLabel}</span>
  `;
}

/* ══════════════════════════════════════════════
   MONTH NAV
══════════════════════════════════════════════ */
function updateMonthLabel() {
  document.getElementById('monthLabel').textContent = `${curYear}.${String(curMonth).padStart(2,'0')}`;
  const isCur = curYear === now.getFullYear() && curMonth === now.getMonth() + 1;
  const isMin = curYear === MIN_YEAR && curMonth === MIN_MONTH;
  document.getElementById('nextBtn').style.opacity = isCur ? '0.3' : '1';
  document.getElementById('nextBtn').style.pointerEvents = isCur ? 'none' : 'auto';
  document.getElementById('prevBtn').style.opacity = isMin ? '0.3' : '1';
  document.getElementById('prevBtn').style.pointerEvents = isMin ? 'none' : 'auto';
}
async function changeMonth(delta) {
  curMonth += delta;
  if (curMonth > 12) { curMonth = 1; curYear++; }
  if (curMonth < 1)  { curMonth = 12; curYear--; }
  updateMonthLabel();
  showLoading();
  await fetchMonthData(curYear, curMonth);
  render();
}

/* ══════════════════════════════════════════════
   MONTH PICKER
══════════════════════════════════════════════ */
let pickerYear = null;
function openPicker() {
  pickerYear = curYear;
  renderPickerMonths();
  const rect = document.getElementById('monthLabel').getBoundingClientRect();
  const p = document.getElementById('picker');
  p.style.display = 'block';
  p.style.top  = (rect.bottom + 8) + 'px';
  p.style.left = (rect.left + rect.width/2 - 130) + 'px';
  document.getElementById('pickerOverlay').classList.add('open');
}
function closePicker() {
  document.getElementById('picker').style.display = 'none';
  document.getElementById('pickerOverlay').classList.remove('open');
}
function changePickerYear(delta) {
  pickerYear += delta;
  if (pickerYear > now.getFullYear()) { pickerYear = now.getFullYear(); return; }
  if (pickerYear < MIN_YEAR) { pickerYear = MIN_YEAR; return; }
  renderPickerMonths();
}
function renderPickerMonths() {
  document.getElementById('pickerYear').textContent = pickerYear + '년';
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('pickerMonths').innerHTML = months.map((m, i) => {
    const mo = i + 1;
    const isActive = pickerYear === curYear && mo === curMonth;
    const isFuture = pickerYear === now.getFullYear() && mo > now.getMonth() + 1;
    const isPast   = pickerYear === MIN_YEAR && mo < MIN_MONTH;
    return `<button class="picker-month-btn ${isActive?'active':''} ${isFuture||isPast?'future':''}" onclick="selectMonth(${mo})">${m}</button>`;
  }).join('');
}
async function selectMonth(month) {
  closePicker();
  curYear = pickerYear; curMonth = month;
  updateMonthLabel(); showLoading();
  await fetchMonthData(curYear, curMonth);
  render();
}

/* ══════════════════════════════════════════════
   RENDER ROUTER
══════════════════════════════════════════════ */
function render() {
  if (curPageId === 'adlog_dashboard') renderDashboard();
  else if (curPageId.startsWith('adlog_')) renderMediaTable(curPageId.replace('adlog_', ''));
  else if (curPageId.startsWith('creative_')) renderCreativeGallery(curPageId.replace('creative_', ''));
  else renderComingSoon();
}

function renderComingSoon() {
  const section = MENU.find(s => s.items.some(i => i.id === curPageId));
  const item    = section?.items.find(i => i.id === curPageId);
  document.getElementById('content').innerHTML = `
    <div class="coming-soon">
      <div class="coming-soon-icon">🚧</div>
      <div class="coming-soon-title">${item?.label || ''}</div>
      <div>준비 중인 페이지입니다</div>
    </div>`;
}

/* ══════════════════════════════════════════════
   MEDIA TABLE
══════════════════════════════════════════════ */
function renderMediaTable(mediaId) {
  const media = MEDIA.find(m => m.id === mediaId);
  const days  = daysInMonth(curYear, curMonth);
  const data  = loadData(curYear, curMonth, mediaId);
  let totalSpend = 0, totalDB = 0, totalRevenue = 0;
  let rows = '';

  for (let d = 1; d <= days; d++) {
    const row  = data[String(d)] || { spend:'', db:'', revenue:'' };
    const dow  = getDayOfWeek(curYear, curMonth, d);
    const isWE = dow === 0 || dow === 6;
    const spendV   = row.spend   !== '' ? Number(row.spend)   : null;
    const dbV      = row.db      !== '' ? Number(row.db)      : null;
    const revenueV = row.revenue !== '' ? Number(row.revenue) : null;
    const cpa  = calcCPA(spendV, dbV);
    const roas = calcROAS(revenueV, spendV);
    if (spendV)   totalSpend   += spendV;
    if (dbV)      totalDB      += dbV;
    if (revenueV) totalRevenue += revenueV;
    const dateStyle = isWE ? `color:${dow===0?'#FF453A':'#4F8EF7'};` : '';
    rows += `
      <tr>
        <td class="td-date">
          <span style="${dateStyle}">${curYear}.${String(curMonth).padStart(2,'0')}.${String(d).padStart(2,'0')}</span>
          <span class="day" style="${dateStyle}">${DAYS_KO[dow]}</span>
        </td>
        <td><input class="cell-input" type="text" inputmode="numeric" placeholder="0" value="${row.spend}" data-day="${d}" data-field="spend" data-media="${mediaId}" onchange="onCellChange(this)" onfocus="this.select()" ${isUnlocked?'':'disabled'}></td>
        <td><input class="cell-input" type="text" inputmode="numeric" placeholder="0" value="${row.db}" data-day="${d}" data-field="db" data-media="${mediaId}" onchange="onCellChange(this)" onfocus="this.select()" ${isUnlocked?'':'disabled'}></td>
        <td class="td-cpa ${cpa?'filled':''}" id="cpa_${mediaId}_${d}">${cpa ? fmtMoney(cpa)+' ₩' : '-'}</td>
        <td><input class="cell-input" type="text" inputmode="numeric" placeholder="0" value="${row.revenue}" data-day="${d}" data-field="revenue" data-media="${mediaId}" onchange="onCellChange(this)" onfocus="this.select()" ${isUnlocked?'':'disabled'}></td>
        <td class="td-roas ${roas?(Number(roas)>=100?'good':'bad'):''}" id="roas_${mediaId}_${d}">${roas ? fmtMoney(roas)+'%' : '-'}</td>
      </tr>`;
  }

  const totalCPA  = calcCPA(totalSpend, totalDB);
  const totalROAS = calcROAS(totalRevenue, totalSpend);
  document.getElementById('content').innerHTML = `
    <div class="section-header">
      <div class="section-title">
        <span style="color:${media.color};font-size:18px;">●</span>${media.name}
        <span class="section-badge">${curYear}.${String(curMonth).padStart(2,'0')}</span>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th class="col-date">날짜</th>
          <th class="col-spend">소진 광고비 (₩)</th>
          <th class="col-db">유입 DB (건)</th>
          <th class="col-cpa">DB 단가 (₩)</th>
          <th class="col-revenue">매출 (₩)</th>
          <th class="col-roas">ROAS</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td>합계</td>
          <td id="foot_spend_${mediaId}">${totalSpend ? fmtMoney(totalSpend) : '-'}</td>
          <td id="foot_db_${mediaId}">${totalDB ? fmtMoney(totalDB) : '-'}</td>
          <td class="total-cpa" id="foot_cpa_${mediaId}">${totalCPA ? fmtMoney(totalCPA)+' ₩' : '-'}</td>
          <td id="foot_revenue_${mediaId}">${totalRevenue ? fmtMoney(totalRevenue) : '-'}</td>
          <td class="total-cpa" id="foot_roas_${mediaId}">${totalROAS ? fmtMoney(totalROAS)+'%' : '-'}</td>
        </tr></tfoot>
      </table>

/* ══════════════════════════════════════════════
   CELL CHANGE
══════════════════════════════════════════════ */
function onCellChange(input) {
  const mediaId = input.dataset.media;
  const day     = String(input.dataset.day);
  const field   = input.dataset.field;
  const raw     = input.value.replace(/,/g, '').trim();
  const num     = raw === '' ? '' : parseInt(raw, 10);
  if (raw !== '' && isNaN(num)) { input.value = ''; return; }
  const data = loadData(curYear, curMonth, mediaId);
  if (!data[day]) data[day] = { spend:'', db:'', revenue:'' };
  data[day][field] = num === '' ? '' : num;
  saveData(curYear, curMonth, mediaId, data);
  if (num !== '') input.value = num;
  const r = data[day];
  const cpa  = calcCPA(r.spend!==''?Number(r.spend):null, r.db!==''?Number(r.db):null);
  const roas = calcROAS(r.revenue!==''?Number(r.revenue):null, r.spend!==''?Number(r.spend):null);
  const cpaEl  = document.getElementById(`cpa_${mediaId}_${day}`);
  const roasEl = document.getElementById(`roas_${mediaId}_${day}`);
  if (cpaEl)  { cpaEl.textContent  = cpa  ? fmtMoney(cpa)+'  ₩' : '-'; cpaEl.className  = `td-cpa ${cpa?'filled':''}`; }
  if (roasEl) { roasEl.textContent = roas ? fmtMoney(roas)+'%' : '-'; roasEl.className = `td-roas ${roas?(Number(roas)>=100?'good':'bad'):''}`; }
  recalcFooter(mediaId);
}

function recalcFooter(mediaId) {
  const data = loadData(curYear, curMonth, mediaId);
  const days = daysInMonth(curYear, curMonth);
  let s=0, d=0, r=0;
  for (let i=1; i<=days; i++) {
    const row = data[String(i)] || {};
    if (row.spend   !== '' && row.spend   != null) s += Number(row.spend);
    if (row.db      !== '' && row.db      != null) d += Number(row.db);
    if (row.revenue !== '' && row.revenue != null) r += Number(row.revenue);
  }
  const cpa = calcCPA(s,d), roas = calcROAS(r,s);
  const get = id => document.getElementById(id);
  if (get(`foot_spend_${mediaId}`))   get(`foot_spend_${mediaId}`).textContent   = s    ? fmtMoney(s)    : '-';
  if (get(`foot_db_${mediaId}`))      get(`foot_db_${mediaId}`).textContent      = d    ? fmtMoney(d)    : '-';
  if (get(`foot_cpa_${mediaId}`))     get(`foot_cpa_${mediaId}`).textContent     = cpa  ? fmtMoney(cpa)+' ₩' : '-';
  if (get(`foot_revenue_${mediaId}`)) get(`foot_revenue_${mediaId}`).textContent = r    ? fmtMoney(r)    : '-';
  if (get(`foot_roas_${mediaId}`))    get(`foot_roas_${mediaId}`).textContent    = roas ? fmtMoney(roas)+'%' : '-';
}

/* ══════════════════════════════════════════════
   CHART
══════════════════════════════════════════════ */
let dashChartInstance = null;
let dashChartMode = 'daily';

function getMonthlyData() {
  const months = new Set();
  Object.keys(dataCache).forEach(k => {
    const m = k.match(/^(\d{4})_(\d{2})_(.+)$/);
    if (m) months.add(`${m[1]}_${m[2]}`);
  });
  return [...months].sort().map(ym => {
    const [y, mo] = ym.split('_');
    const days = new Date(Number(y), Number(mo), 0).getDate();
    let spend=0, revenue=0, db=0;
    MEDIA.forEach(mid => {
      const data = loadData(Number(y), Number(mo), mid.id);
      for (let d=1; d<=days; d++) {
        const r = data[String(d)] || {};
        if (r.spend   !== '' && r.spend   != null) spend   += Number(r.spend);
        if (r.revenue !== '' && r.revenue != null) revenue += Number(r.revenue);
        if (r.db      !== '' && r.db      != null) db      += Number(r.db);
      }
    });
    return { label:`${y}.${mo}`, spend, revenue, db, roas: calcROAS(revenue, spend) };
  });
}

function renderDashboardChart(days) {
  if (dashChartInstance) { dashChartInstance.destroy(); dashChartInstance = null; }
  let labels, spends, revenues, roasArr;
  if (dashChartMode === 'monthly') {
    const monthly = getMonthlyData();
    labels = monthly.map(m => m.label); spends = monthly.map(m => m.spend);
    revenues = monthly.map(m => m.revenue); roasArr = monthly.map(m => m.roas);
  } else {
    labels=[]; spends=[]; revenues=[]; roasArr=[];
    for (let d=1; d<=days; d++) {
      labels.push(`${d}일`);
      let ts=0, tr=0;
      MEDIA.forEach(m => {
        const data = loadData(curYear, curMonth, m.id);
        const r = data[String(d)] || {};
        if (r.spend   !== '' && r.spend   != null) ts += Number(r.spend);
        if (r.revenue !== '' && r.revenue != null) tr += Number(r.revenue);
      });
      spends.push(ts); revenues.push(tr); roasArr.push(calcROAS(tr, ts));
    }
  }
  const ctx = document.getElementById('dashChart').getContext('2d');
  dashChartInstance = new Chart(ctx, {
    data: { labels, datasets: [
      { type:'bar', label:'광고비', data:spends, backgroundColor:'rgba(79,142,247,0.4)', borderColor:'#4F8EF7', borderWidth:1.5, borderRadius:4, yAxisID:'yMoney', order:2 },
      { type:'bar', label:'매출',   data:revenues, backgroundColor:'rgba(52,199,89,0.35)', borderColor:'#34C759', borderWidth:1.5, borderRadius:4, yAxisID:'yMoney', order:3 },
      { type:'line', label:'ROAS', data:roasArr, borderColor:'#F4A030', backgroundColor:'rgba(244,160,48,0.12)', borderWidth:2.5, pointRadius:3.5, pointBackgroundColor:'#F4A030', tension:0.35, yAxisID:'yROAS', spanGaps:true, order:1 },
    ]},
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins: {
        legend:{ display:false },
        tooltip:{ backgroundColor:'#1E2230', borderColor:'#2A2E3E', borderWidth:1, titleColor:'#7A8099', bodyColor:'#E8EAF0', padding:12,
          callbacks:{ label(ctx) {
            if (ctx.dataset.label==='ROAS') return ctx.parsed.y!=null ? ` ROAS  ${ctx.parsed.y.toLocaleString('ko-KR')}%` : ' ROAS  -';
            return ` ${ctx.dataset.label}  ₩${Number(ctx.parsed.y).toLocaleString('ko-KR')}`;
          }}
        }
      },
      scales: {
        x: { grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#464D66',font:{size:10},maxTicksLimit:16,maxRotation:0}, border:{color:'#2A2E3E'} },
        yMoney: { type:'linear', position:'left', grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#464D66',font:{size:10}, callback:v=>v===0?'0':v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'K':v}, border:{color:'#2A2E3E'} },
        yROAS:  { type:'linear', position:'right', grid:{drawOnChartArea:false}, ticks:{color:'#F4A030',font:{size:10},callback:v=>fmtMoney(v)+'%'}, border:{color:'#2A2E3E'} },
      }
    }
  });
}

function setDashChartMode(mode) {
  dashChartMode = mode;
  document.querySelectorAll('.dash-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.mode===mode));
  renderDashboardChart(daysInMonth(curYear, curMonth));

/* ══════════════════════════════════════════════
   CREATIVE GALLERY
══════════════════════════════════════════════ */
const creativeCache = {};

function creativeCacheKey(year, month, mediaId) {
  return `creative_${year}_${String(month).padStart(2,'0')}_${mediaId}`;
}

function loadCreatives(year, month, mediaId) {
  return creativeCache[creativeCacheKey(year, month, mediaId)] || [];
}

async function fetchCreatives(year, month, mediaId) {
  try {
    const path = `creatives/${year}/${String(month).padStart(2,'0')}/${mediaId}`;
    const snap = await db.ref(path).once('value');
    const val  = snap.val();
    const list = val ? Object.entries(val).map(([k,v]) => ({ ...v, _key: k })) : [];
    creativeCache[creativeCacheKey(year, month, mediaId)] = list;
    return list;
  } catch(e) {
    console.error('Firebase 데이터 조회 오류:', e);
    return [];
  }
}

async function saveCreative(year, month, mediaId, item) {
  const path = `creatives/${year}/${String(month).padStart(2,'0')}/${mediaId}`;
  const ref  = await db.ref(path).push(item);
  const newItem = { ...item, _key: ref.key };
  const list = loadCreatives(year, month, mediaId);
  list.push(newItem);
  creativeCache[creativeCacheKey(year, month, mediaId)] = list;
  return newItem;
}

async function updateCreative(year, month, mediaId, key, item) {
  const path = `creatives/${year}/${String(month).padStart(2,'0')}/${mediaId}/${key}`;
  await db.ref(path).set(item);
  const list = loadCreatives(year, month, mediaId);
  const index = list.findIndex(i => i._key === key);
  if (index !== -1) {
    list[index] = { ...item, _key: key };
    creativeCache[creativeCacheKey(year, month, mediaId)] = list;
  }
}

async function deleteCreative(year, month, mediaId, key) {
  const path = `creatives/${year}/${String(month).padStart(2,'0')}/${mediaId}/${key}`;
  await db.ref(path).remove();
  const list = loadCreatives(year, month, mediaId).filter(i => i._key !== key);
  creativeCache[creativeCacheKey(year, month, mediaId)] = list;
}

function toDirectImageUrl(url) {
  if (!url) return url;
  const m1 = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if (m1) return `https://drive.google.com/uc?export=view&id=${m1[1]}`;
  const m2 = url.match(/drive\.google\.com\/open\?id=([^&]+)/);
  if (m2) return `https://drive.google.com/uc?export=view&id=${m2[1]}`;
  return url;
}

    </div>

async function confirmCreativeAction(mediaId, action) {
  const selectedCards = document.querySelectorAll('.select-card.selected');
  if (selectedCards.length === 0) {
    alert('소재를 선택해주세요.');
    return;
  }

  if (action === 'edit') {
    if (selectedCards.length > 1) {
      alert('수정은 한 개의 소재만 선택해주세요.');
      return;
    }
    const key = selectedCards[0].dataset.key;
    const list = loadCreatives(curYear, curMonth, mediaId);
    const item = list.find(i => i._key === key);
    if (item) {
      closeAddCreativeModal();
      openEditCreativeModal(mediaId, key, item.campaign, item.title, item.url);
    }
  } else if (action === 'delete') {
    if (!confirm(`${selectedCards.length}개의 소재를 삭제하시겠습니까?`)) return;
    const keys = Array.from(selectedCards).map(card => card.dataset.key);
    for (const key of keys) {
      await deleteCreative(curYear, curMonth, mediaId, key);
    }
    closeAddCreativeModal();
    renderCreativeGallery(mediaId);
  }
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function onFileSelected(input) {
  const file = input.files[0];
  if (file) {
    // 파일 크기 체크 (10MB)
    if (file.size > 10 * 1024 * 1024) {
      alert('파일 크기가 10MB를 초과합니다. 더 작은 파일을 선택해주세요.');
      input.value = '';
      return;
    }

    // 파일 타입 체크
    if (!file.type.startsWith('image/')) {
      alert('이미지 파일만 선택할 수 있습니다.');
      input.value = '';
      return;
    }

    // 파일 선택 시 URL 필드 숨기기 (추가 모달에서만)
    const urlField = document.getElementById('urlField');
    if (urlField) {
      urlField.style.display = 'none';
    }
  } else {
    // 파일 선택 취소 시 URL 필드 보이기 (추가 모달에서만)
    const urlField = document.getElementById('urlField');
    if (urlField) {
      urlField.style.display = 'block';
    }
  }
}

function openAddCreativeModal(mediaId) {
  const overlay = document.getElementById('modalOverlay');
  overlay.innerHTML = `
    <div class="add-modal">
      <div class="add-modal-title">🖼️ 소재 추가</div>
      <div class="form-field">
        <label class="form-label">캠페인명</label>
        <input class="form-input" id="c_campaign" type="text" placeholder="예: 봄 신규 캠페인" maxlength="50">
      </div>
      <div class="form-field">
        <label class="form-label">소재 제목</label>
        <input class="form-input" id="c_title" type="text" placeholder="예: 메인 배너 A" maxlength="50">
      </div>
      <div class="form-field">
        <label class="form-label">이미지 파일</label>
        <input class="form-input" id="c_file" type="file" accept="image/*" onchange="onFileSelected(this)">
        <div class="form-hint">JPG, PNG, GIF 파일을 선택하세요 (최대 10MB)</div>
      </div>
      <div class="form-field" id="urlField" style="display:none;">
        <label class="form-label">또는 이미지 URL</label>
        <input class="form-input" id="c_url" type="url" placeholder="https://drive.google.com/file/d/...">
        <div class="form-hint">구글 드라이브 링크를 붙여넣으면 자동 변환됩니다</div>
      </div>
      <div class="modal-btns" style="margin-top:8px;">
        <button class="modal-btn cancel" onclick="closeAddCreativeModal()">취소</button>
        <button class="modal-btn confirm" onclick="submitCreative('${mediaId}')">추가</button>
      </div>
    </div>`;
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('c_campaign')?.focus(), 100);
}

function openEditCreativeModal(mediaId, key, campaign, title, url) {
  const overlay = document.getElementById('modalOverlay');
  overlay.innerHTML = `
    <div class="add-modal">
      <div class="add-modal-title">✏️ 소재 수정</div>
      <div class="form-field">
        <label class="form-label">캠페인명</label>
        <input class="form-input" id="c_campaign" type="text" placeholder="예: 봄 신규 캠페인" maxlength="50" value="${campaign}">
      </div>
      <div class="form-field">
        <label class="form-label">소재 제목</label>
        <input class="form-input" id="c_title" type="text" placeholder="예: 메인 배너 A" maxlength="50" value="${title}">
      </div>
      <div class="form-field">
        <label class="form-label">새 이미지 파일 (선택사항)</label>
        <input class="form-input" id="c_file" type="file" accept="image/*" onchange="onFileSelected(this)">
        <div class="form-hint">새 파일을 선택하면 기존 이미지를 교체합니다 (JPG, PNG, GIF, 최대 10MB)</div>
      </div>
      <div class="form-field">
        <label class="form-label">현재 이미지 URL</label>
        <input class="form-input" id="c_url" type="url" placeholder="https://drive.google.com/file/d/..." value="${url}">
        <div class="form-hint">파일을 선택하지 않으면 이 URL이 유지됩니다</div>
      </div>
      <div class="modal-btns" style="margin-top:8px;">
        <button class="modal-btn cancel" onclick="closeAddCreativeModal()">취소</button>
        <button class="modal-btn confirm" onclick="submitEditCreative('${mediaId}','${key}')">수정</button>
      </div>
    </div>`;
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('c_campaign')?.focus(), 100);
}

function closeAddCreativeModal() {
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('open');
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">🔐 편집 잠금 해제</div>
      <div class="modal-sub">데이터를 입력하려면 비밀번호를 입력하세요</div>
      <input class="modal-input" id="pwInput" type="password" maxlength="20" placeholder="••••"
        onkeydown="if(event.key==='Enter') submitPassword()" oninput="clearError()">
      <div class="modal-error" id="pwError"></div>
      <div class="modal-btns">
        <button class="modal-btn cancel" onclick="closeModal()">취소</button>
        <button class="modal-btn confirm" onclick="submitPassword()">확인</button>
      </div>
    </div>`;
}

async function uploadFileToStorage(file, mediaId) {
  const timestamp = Date.now();
  const fileName = `${timestamp}_${file.name}`;
  const storageRef = storage.ref(`creatives/${mediaId}/${fileName}`);
  const uploadTask = await storageRef.put(file);
  const downloadURL = await uploadTask.ref.getDownloadURL();
  return downloadURL;
}

async function submitCreative(mediaId) {
  const campaign = document.getElementById('c_campaign')?.value.trim();
  const title    = document.getElementById('c_title')?.value.trim();
  const urlInput = document.getElementById('c_url')?.value.trim();
  const fileInput = document.getElementById('c_file');
  const file = fileInput?.files[0];

  if (!campaign || !title) { alert('캠페인명과 소재 제목을 입력해주세요'); return; }
  if (!urlInput && !file) { alert('이미지 URL을 입력하거나 파일을 선택해주세요'); return; }

  let finalUrl = urlInput;
  if (file) {
    // 파일 업로드
    try {
      finalUrl = await uploadFileToStorage(file, mediaId);
    } catch(e) {
      console.error('파일 업로드 오류:', e);
      alert('파일 업로드에 실패했습니다. 다시 시도해주세요.');
      return;
    }
  }

  const today = new Date();
  const addedAt = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  closeAddCreativeModal();
  await saveCreative(curYear, curMonth, mediaId, { campaign, title, url: finalUrl, addedAt });
  renderCreativeGallery(mediaId);
}

async function submitEditCreative(mediaId, key) {
  const campaign = document.getElementById('c_campaign')?.value.trim();
  const title    = document.getElementById('c_title')?.value.trim();
  const urlInput = document.getElementById('c_url')?.value.trim();
  const fileInput = document.getElementById('c_file');
  const file = fileInput?.files[0];

  if (!campaign || !title) { alert('캠페인명과 소재 제목을 입력해주세요'); return; }
  if (!urlInput && !file) { alert('이미지 URL을 입력하거나 파일을 선택해주세요'); return; }

  let finalUrl = urlInput;
  if (file) {
    // 파일 업로드
    try {
      finalUrl = await uploadFileToStorage(file, mediaId);
    } catch(e) {
      console.error('파일 업로드 오류:', e);
      alert('파일 업로드에 실패했습니다. 다시 시도해주세요.');
      return;
    }
  }

  closeAddCreativeModal();
  await updateCreative(curYear, curMonth, mediaId, key, { campaign, title, url: finalUrl });
  renderCreativeGallery(mediaId);
}

function openDeleteCreativeModal(mediaId) {
  const list = loadCreatives(curYear, curMonth, mediaId);
  if (list.length === 0) { alert('삭제할 소재가 없습니다.'); return; }
  const overlay = document.getElementById('modalOverlay');
  const itemsHtml = list.map(item => `
    <label style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;margin-bottom:8px;">
      <input type="checkbox" data-key="${item._key}" style="width:16px;height:16px;">
      <span style="font-size:13px;color:var(--text);">[${item.campaign}] ${item.title}</span>
    </label>`).join('');
  overlay.innerHTML = `
    <div class="add-modal">
      <div class="add-modal-title">🗑 소재 삭제</div>
      <div style="max-height:300px;overflow-y:auto;margin-bottom:20px;">${itemsHtml}</div>
      <div class="modal-btns">
        <button class="modal-btn cancel" onclick="closeAddCreativeModal()">취소</button>
        <button class="modal-btn confirm" style="background:var(--red);" onclick="confirmDeleteCreatives('${mediaId}')">삭제</button>
      </div>
    </div>`;
  overlay.classList.add('open');
}

async function confirmDeleteCreatives(mediaId) {
  const checked = document.querySelectorAll('#modalOverlay input[type=checkbox]:checked');
  if (checked.length === 0) { alert('삭제할 소재를 선택해주세요.'); return; }
  if (!confirm(checked.length + '개를 삭제하시겠습니까?')) return;
  for (const cb of checked) {
    await deleteCreative(curYear, curMonth, mediaId, cb.dataset.key);
  }
  closeAddCreativeModal();
  renderCreativeGallery(mediaId);
}

async function deletCreative(mediaId, key) {
  if (!confirm('이 소재를 삭제할까요?')) return;
  await deleteCreative(curYear, curMonth, mediaId, key);
  renderCreativeGallery(mediaId);
}

function openImgModal(url, title, campaign) {
  document.getElementById('imgModalSrc').src = url;
  document.getElementById('imgModalTitle').textContent = title;
  document.getElementById('imgModalCampaign').textContent = campaign;
  document.getElementById('imgModalOverlay').classList.add('open');
}

function closeImgModal(e) {
  if (!e || e.target === document.getElementById('imgModalOverlay') || e.type === 'click') {
    document.getElementById('imgModalOverlay').classList.remove('open');
  }
}
