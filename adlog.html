<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HelixAmc Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-dot"></div>
        <span class="logo-text">마케팅 리포트</span>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>
    </div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <!-- MAIN -->
  <div class="main" id="main">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-breadcrumb" id="breadcrumb"></div>
      </div>
      <div class="month-nav">
        <button class="month-btn" id="prevBtn" onclick="changeMonth(-1)">‹</button>
        <div class="month-label" id="monthLabel" onclick="openPicker()"></div>
        <button class="month-btn" id="nextBtn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="picker-overlay" id="pickerOverlay" onclick="closePicker()"></div>
      <div class="picker" id="picker" style="display:none">
        <div class="picker-header">
          <button class="picker-year-btn" onclick="changePickerYear(-1)">‹</button>
          <div class="picker-year" id="pickerYear"></div>
          <button class="picker-year-btn" onclick="changePickerYear(1)">›</button>
        </div>
        <div class="picker-months" id="pickerMonths"></div>
      </div>
      <button class="lock-btn" id="lockBtn" onclick="onLockBtnClick()">
        <span class="lock-icon">🔒</span>
        <span id="lockBtnText">LOCK</span>
      </button>
    </header>

    <!-- PASSWORD MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="onOverlayClick(event)">
      <div class="modal">
        <div class="modal-title">🔐 편집 잠금 해제</div>
        <div class="modal-sub">데이터를 입력하려면 비밀번호를 입력하세요</div>
        <input class="modal-input" id="pwInput" type="password" maxlength="20" placeholder="••••"
          onkeydown="if(event.key==='Enter') submitPassword()" oninput="clearError()">
        <div class="modal-error" id="pwError"></div>
        <div class="modal-btns">
          <button class="modal-btn cancel" onclick="closeModal()">취소</button>
          <button class="modal-btn confirm" onclick="submitPassword()">확인</button>
        </div>
      </div>
    </div>

    <!-- CONTENT -->
    <main class="content" id="content"></main>

  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
